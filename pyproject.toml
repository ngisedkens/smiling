[build-system]
requires = [
    'nanobind >=3.0.1',
    'scikit-build-core >=1.0.0',
]
build-backend = 'scikit_build_core.build'

[project]
name = 'smiling'
version = '0.2.0'
requires-python = '>=3.14'
license = 'GPL-2.0-only'
dependencies = [
    'beautifulsoup4',
    'hishel[fastapi] >=1.0.0',
    'm3u8 >=6.0.0',
    'zapros[pyreqwest] >=0.17.0',
]

[tool.basedpyright]
strict = ['src']
typeCheckingMode = 'off'

[[tool.scikit-build.overrides]]
if.env.CONDA_BUILD = true
cmake.args = ['-GNinja']
